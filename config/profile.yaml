  biography: |
    Hi! I'm <strong>Alex Batista Trentin</strong>, a PhD researcher in Agronomy at
    <strong>Purdue University</strong>, where I work at the intersection of
    <strong>experimental microbiology, microbial ecology, and bioinformatics</strong>.
    My research combines laboratory experimentation, high-throughput sequencing,
    reproducible data analysis, and statistical modeling to understand microbial
    communities and their interactions with environmental systems.
    <div class="my-2"></div>
    My work includes soil microbiome responses to agricultural management,
    microbial stable isotope probing, and methodological questions in DNA recovery.
    I also have experience with microbial cultivation, molecular methods, and
    plant–microbe interactions from earlier research in Brazil.
    <div class="my-2"></div>
    I am interested in interdisciplinary scientific research and applications
    across biotechnology, agricultural innovation, and the life sciences—especially
    projects that connect experimental discovery with computational analysis.

